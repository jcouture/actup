name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "23 11 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - go

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.5
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4.39.5
      - uses: github/codeql-action/analyze@v4.39.5
        with:
          category: /language:${{ matrix.language }}
